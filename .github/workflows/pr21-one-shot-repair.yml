name: PR 21 one-shot generated-file repair
on:
  push:
    branches:
      - docs/agent-contracts

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'tbrandenburg/agentilogue' && github.ref == 'refs/heads/docs/agent-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Format and refresh catalog
        run: |
          bun install --frozen-lockfile
          bunx oxfmt docs/CONTRACTS.md lib/agent/contracts.ts lib/agent/api-contracts.ts
          bun run models:sync
          bun run models:check
          bun run format
          bun run lint
          bun run test
          bunx tsc --noEmit
      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr21-one-shot-repair.yml
          git add docs/CONTRACTS.md lib/agent/contracts.ts lib/agent/api-contracts.ts data/models.json
          git commit -m "chore: format agent contracts and sync model catalog"
          git push origin HEAD:docs/agent-contracts
