name: Chore

on:
  pull_request:

jobs:
  models:
    name: Models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: node scripts/check-runtimes.cjs
      - run: bun run models:check
      - name: Explain model catalog failures
        if: ${{ failure() }}
        run: |
          echo "Models check failed. PR owner: resolve model-catalog drift directly in this PR. Run bun run models:sync, review data/models.json and tier choices, then iterate until bun run models:check passes. Fix any other reported cause in this PR as well."
