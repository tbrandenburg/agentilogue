name: One-shot format contract tests
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format-tests:
    if: github.repository == 'tbrandenburg/agentilogue' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/agent-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/agent-contracts
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: |
          bun install --frozen-lockfile
          bunx oxfmt lib/agent/contracts/contracts.test.ts
          bun run format
          bun run lint
          bun run test
          bun run typecheck
      - name: Commit format change and remove the one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/contracts-format-one-shot.yml
          git add lib/agent/contracts/contracts.test.ts
          git commit -m "style(contracts): apply repo formatter to snapshot contract tests"
          git push origin HEAD:docs/agent-contracts
